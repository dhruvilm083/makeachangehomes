<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log in | MACH</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/portal/portal.css">
</head>
<body>
<main class="login">
  <form id="login" autocomplete="on">
    <h1 class="login-logo"><img src="/assets/632d8af1ed30f2086135647e_make-a-change-logo-black.svg" alt="Make A Change Homes" width="353" height="76"></h1>
    <label class="sr-only" for="pw">Password</label>
    <div class="pw-wrap">
      <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
      <button type="button" class="pw-eye" id="eye" aria-label="Show password" aria-pressed="false" title="Show password">
        <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <button class="btn btn-primary" type="submit">Log in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
(function () {
  var form = document.getElementById('login');
  var err = document.getElementById('err');
  // Eye button: click once to show the password, click again to hide it.
  var eye = document.getElementById('eye');
  eye.addEventListener('click', function () {
    var show = form.password.type === 'password';
    form.password.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', show ? 'true' : 'false');
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    eye.title = show ? 'Hide password' : 'Show password';
    form.password.focus();
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = form.querySelector('button');
    btn.disabled = true;
    err.textContent = '';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: form.password.value })
    }).then(function (r) {
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Could not log in.'); return d; });
    }).then(function (d) {
      location.replace(d.next);
    }).catch(function (e2) {
      err.textContent = e2.message || 'Could not log in.';
      btn.disabled = false;
      form.password.select();
    });
  });
})();
</script>
</body>
</html>
