<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log in | MACH</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/portal/portal.css">
</head>
<body>
<main class="login">
  <form id="login" autocomplete="on">
    <h1>Make A Change Homes</h1>
    <label class="sr-only" for="pw">Password</label>
    <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button class="btn btn-primary" type="submit">Log in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
(function () {
  var form = document.getElementById('login');
  var err = document.getElementById('err');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = form.querySelector('button');
    btn.disabled = true;
    err.textContent = '';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: form.password.value })
    }).then(function (r) {
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Could not log in.'); return d; });
    }).then(function (d) {
      location.replace(d.next);
    }).catch(function (e2) {
      err.textContent = e2.message || 'Could not log in.';
      btn.disabled = false;
      form.password.select();
    });
  });
})();
</script>
</body>
</html>
